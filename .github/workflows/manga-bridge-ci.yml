name: Manga Bridge isolated checks
on:
  push:
    branches: [manga-bridge-2, manga-bridge-2-transport, manga-bridge-1-7-53]
    paths: ['manga-bridge-2/**', '.github/workflows/manga-bridge-*.yml']
  pull_request:
    branches: [manga-bridge-2, manga-bridge-2-transport]
    paths: ['manga-bridge-2/**', '.github/workflows/manga-bridge-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbi2-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: mbi2_ci
          MARIADB_ROOT_PASSWORD: mbi2-disposable-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, dom, openssl
          coverage: none
      - name: Syntax and contract tests
        env:
          MBI2_VECTOR_OUTPUT: /tmp/mbi2-public-test-vector.json
        run: |
          set -eu
          find manga-bridge-2 -name '*.php' -print0 | xargs -0 -n1 php -l
          python -m compileall -q manga-bridge-2/engine manga-bridge-2/scripts manga-bridge-2/extractor
          PYTHONPATH=manga-bridge-2 python -m unittest discover -s manga-bridge-2/extractor/test -v
          php manga-bridge-2/tests/php-tests.php
          python -m unittest discover -s manga-bridge-2/tests -p 'test_*.py' -v
      - name: Package isolated staging extension
        run: python manga-bridge-2/scripts/package.py
      - name: WordPress and MariaDB transport and preservation
        env:
          MBI2_CI_DB_PASSWORD: mbi2-disposable-ci-only
        run: bash manga-bridge-2/scripts/wp-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve and test existing manifest engine
        working-directory: manga-bridge-2/engine
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: manga-bridge-control-staging
          path: manga-bridge-2/dist/
          retention-days: 3
          if-no-files-found: error
