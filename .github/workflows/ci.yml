name: Verify laboratory
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==13.0.0'
      - run: node scripts/prepare-decoder-check.mjs
      - run: python scripts/verify-pixels.py
