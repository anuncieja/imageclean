name: Manga Bridge one bounded staging job
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'UUID of an existing authenticated staging request'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mbi2-executor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect one staging work
        env:
          MBI2_JOB_ID: ${{ inputs.job_id }}
          MBI2_WORDPRESS_ENDPOINT: ${{ secrets.MBI2_WORDPRESS_ENDPOINT }}
          MBI2_HMAC_KEY_B64: ${{ secrets.MBI2_HMAC_KEY_B64 }}
          MBI2_ALLOWED_MEDIA_HOSTS: ${{ vars.MBI2_ALLOWED_MEDIA_HOSTS }}
        run: python manga-bridge-2/engine/run.py
